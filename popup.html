<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nametag</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon-48.png" alt="" width="28" height="28">
    <div>
      <h1>Nametag</h1>
      <p class="sub">Site title: <span id="site-title">Loading…</span></p>
    </div>
  </header>

  <form id="title-form">
    <label for="custom-title">Custom title</label>
    <div class="field-row">
      <input
        id="custom-title"
        name="custom-title"
        type="text"
        maxlength="200"
        autocomplete="off"
        placeholder="e.g. Research — sources"
      >
      <button id="save" class="primary" type="submit">Save</button>
    </div>
  </form>

  <footer>
    <span id="status" role="status" aria-live="polite">Remembered for this page.</span>
    <button id="reset" type="button">Reset to site title</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
