<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tab Renamer</title>
    <link rel="icon" href="icons/icon-32.png">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <h1>Tab title</h1>

      <form id="title-form">
        <label for="custom-title">Custom title</label>
        <div class="field-row">
          <input
            id="custom-title"
            name="custom-title"
            type="text"
            maxlength="200"
            autocomplete="off"
            placeholder="e.g. Research — sources"
          >
          <button id="save" type="submit">Enter</button>
        </div>
      </form>

      <p class="site-title">
        Site title: <span id="site-title">Loading…</span>
      </p>

      <div class="footer-row">
        <p id="status" role="status" aria-live="polite"></p>
        <button id="reset" class="reset" type="button">Reset to site title</button>
      </div>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
